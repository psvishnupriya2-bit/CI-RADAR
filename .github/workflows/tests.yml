name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx lightgbm pandas numpy scikit-learn pydantic psycopg2-binary python-dotenv pytest
      - run: python -m pytest -q
